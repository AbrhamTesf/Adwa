name: Bug report
description: Report a reproducible problem in Adwa Lens.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, Node.js version, or device
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Do not include API keys or other secrets.
