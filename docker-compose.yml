version: "3.9"

services:
  adwa-lens:
    build:
      context: .
      target: dev
    container_name: adwa-lens-dev
    ports:
      - "5173:5173"   # Vite client
      - "8787:8787"   # Fastify BFF (Gemini/Groq/ElevenLabs proxy)
    env_file:
      - backend/.env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
    command: ["npm", "run", "dev:all"]
